<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Blockchain Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">StudentChain</div>
        <div class="nav-text">Blockchain Student Registration</div>
    </nav>

    <main>

        <section class="hero">
            <h1>Student Registration</h1>
            <p>
                Securely register and verify student details using blockchain.
            </p>
        </section>

        <section class="container">

            <!-- Register Student -->
            <div class="card">

                <h2>Register Student</h2>

                <label>Student Name</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                >

                <label>Roll Number</label>
                <input
                    type="number"
                    id="rollNumber"
                    placeholder="Enter roll number"
                >

                <button onclick="registerStudent()">
                    Register Student
                </button>

                <p id="registerStatus" class="status"></p>

            </div>


            <!-- Search Student -->
            <div class="card">

                <h2>Search Student</h2>

                <label>Roll Number</label>

                <input
                    type="number"
                    id="searchRollNumber"
                    placeholder="Enter roll number"
                >

                <button onclick="searchStudent()">
                    Search Student
                </button>

                <div id="studentResult" class="result">
                    <p>Student details will appear here.</p>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 StudentChain | Blockchain Mini Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
